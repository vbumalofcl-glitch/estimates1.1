<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel-Like Fillable Grid Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="excel_grid.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">X</div>
      <div class="brand-title">Excel Grid Engine</div>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">
      Drag fill handle, inline edit, keyboard nav & formulas active
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="btn-tool" onclick="undo()" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        Undo
      </button>
      <button class="btn-tool" onclick="redo()" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
        Redo
      </button>
    </div>

    <div class="toolbar-group">
      <button class="btn-tool" id="btnBold" onclick="toggleFormat('bold')" title="Bold (Ctrl+B)">
        <strong>B</strong>
      </button>
      <button class="btn-tool" id="btnItalic" onclick="toggleFormat('italic')" title="Italic (Ctrl+I)">
        <em>I</em>
      </button>
    </div>

    <div class="toolbar-group">
      <button class="btn-tool" onclick="setTextAlign('left')" title="Align Left">Left</button>
      <button class="btn-tool" onclick="setTextAlign('center')" title="Align Center">Center</button>
      <button class="btn-tool" onclick="setTextAlign('right')" title="Align Right">Right</button>
    </div>

    <div class="toolbar-group">
      <button class="btn-tool" onclick="insertRow()" title="Insert Row Above">+ Row</button>
      <button class="btn-tool" onclick="deleteRow()" title="Delete Current Row">- Row</button>
      <button class="btn-tool" onclick="insertColumn()" title="Insert Column Left">+ Col</button>
      <button class="btn-tool" onclick="deleteColumn()" title="Delete Current Column">- Col</button>
    </div>

    <div class="toolbar-group">
      <button class="btn-tool" onclick="exportCSV()" title="Export Grid to CSV">Export CSV</button>
      <button class="btn-tool" onclick="clearAllData()" title="Clear All Cells">Clear All</button>
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formula-bar">
    <div id="cellAddress" class="cell-address-box">A1</div>
    <div class="formula-fx-label">fx</div>
    <input id="formulaInput" class="formula-input" type="text" placeholder="Enter value or formula (e.g. =SUM(A1:A5))" autocomplete="off" />
  </div>

  <!-- Main Grid Viewport -->
  <div id="gridViewport" class="grid-viewport">
    <table id="gridTable" class="grid-table">
      <!-- Table Header & Body generated by JS -->
    </table>

    <!-- Selection Overlay Elements -->
    <div id="selectionBox">
      <div id="fillHandle"></div>
    </div>
    <div id="fillPreviewBox"></div>

    <!-- Inline Cell Editor Input -->
    <input id="inlineEditor" type="text" autocomplete="off" />
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div id="statusMode">READY</div>
    <div class="status-stats">
      <div class="stat-item"><span class="stat-label">AVERAGE:</span><span id="statAverage" class="stat-val">-</span></div>
      <div class="stat-item"><span class="stat-label">COUNT:</span><span id="statCount" class="stat-val">0</span></div>
      <div class="stat-item"><span class="stat-label">MIN:</span><span id="statMin" class="stat-val">-</span></div>
      <div class="stat-item"><span class="stat-label">MAX:</span><span id="statMax" class="stat-val">-</span></div>
      <div class="stat-item"><span class="stat-label">SUM:</span><span id="statSum" class="stat-val">-</span></div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="contextMenu" class="context-menu">
    <div class="context-menu-item" onclick="executeContextAction('copy')">Copy <span>Ctrl+C</span></div>
    <div class="context-menu-item" onclick="executeContextAction('cut')">Cut <span>Ctrl+X</span></div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" onclick="executeContextAction('insertRow')">Insert Row Above</div>
    <div class="context-menu-item" onclick="executeContextAction('deleteRow')">Delete Row</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" onclick="executeContextAction('clear')">Clear Contents <span>Del</span></div>
  </div>

  <script src="excel_grid.js"></script>
</body>
</html>
